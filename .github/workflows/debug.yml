name: Debug build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SING_BOX_VERSION: v1.14.3
  XRAY_VERSION: v26.9.30
  NDK_VERSION: 28.2.13676358
  SING_BOX_SHA: ""
  XRAY_SHA: ""

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch core sources
        run: |
          git clone --depth 1 --branch "$SING_BOX_VERSION" https://github.com/SagerNet/sing-box third_party/sing-box
          git clone --depth 1 --branch "$XRAY_VERSION" https://github.com/XTLS/Xray-core third_party/xray-core
          for entry in sing-box:SING_BOX_SHA xray-core:XRAY_SHA; do
            dir="${entry%%:*}"; var="${entry##*:}"; want="${!var:-}"
            got="$(git -C "third_party/$dir" rev-parse HEAD)"
            echo "$dir @ $got"
            if [ -z "$want" ]; then
              echo "::warning::$var is not pinned; pin it to $got"
            elif [ "$want" != "$got" ]; then
              echo "::error::$dir commit mismatch: expected $want, got $got"; exit 1
            fi
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-37.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build core (sing-box + Xray)
        working-directory: core
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile github.com/sagernet/gomobile/cmd/gobind
          ./build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
